[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "ts-pyilc"
description = "Library to communicate with LSST ILCs."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://ts-pyilc.lsst.io", repository = "https://github.com/lsst-ts/ts_pyilc" }
dynamic = [ "version" ]
dependencies = [
  "asyncclick",
  "intelhex",
  "pymodbus>=3.12.0",
  "pyserial-asyncio",
]

[project.scripts]
ilccli = "lsst.ts.pyilc.cli:run"
run_ilcsimulator = "lsst.ts.pyilc.simulator:run"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]
write_to = "python/lsst/ts/pyilc/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[dependency-groups]
test = [
   "parameterized",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
